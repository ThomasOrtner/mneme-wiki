[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme-wiki"
version = "0.1.0"
description = "Local, LLM-maintained Karpathy-style wiki of interlinked Markdown notes (Ollama)."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "ollama>=0.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "rank_bm25>=0.2.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mneme-wiki = "mneme_wiki.cli:main"
# mneme-wiki-mcp = "mneme_wiki.mcp_server:main"   # M6

[tool.setuptools.packages.find]
include = ["mneme_wiki*"]

[tool.setuptools.package-data]
mneme_wiki = ["templates/*.md", "prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server (opt-in: pytest -m ollama)"]
addopts = "-m 'not ollama'"
